name: Build Windows Installer

# Builds the Windows installer (.exe) on a Windows runner (no Wine needed there)
# and PUBLISHES it to a GitHub Release as v<version>, including the latest.yml
# update manifest + blockmaps that the in-app auto-updater (electron-updater)
# reads. Bump "version" in package.json to ship an update to installed apps.

on:
  push:
    branches: [ "claude/confident-mayer-x9cxvu" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run smoke

      # Build + publish to a GitHub Release (v<version>) so the auto-updater can
      # find latest.yml. electron-builder reuses an existing release for the same
      # version (assets are overwritten); bump the version for a real update.
      - name: Build & publish installer
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Per-version release notes from CHANGELOG.md (shown on the GitHub Release).
      - name: Set release notes from CHANGELOG
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/changelog.js "$VERSION" > RELEASE_NOTES.md
          echo "Release notes for v$VERSION:"; cat RELEASE_NOTES.md
          gh release edit "v$VERSION" --title "v$VERSION" --notes-file RELEASE_NOTES.md

      - name: List build output
        shell: bash
        run: ls -lh release/*.exe release/*.yml || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDR-Clinic-Windows
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 90
          if-no-files-found: error
