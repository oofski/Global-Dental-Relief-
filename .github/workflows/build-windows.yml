name: Build Windows Installer

# Builds the Windows installer (.exe) on a Windows runner (no Wine needed there)
# and PUBLISHES it to a GitHub Release as v<version>, including the latest.yml
# update manifest + blockmaps that the in-app auto-updater (electron-updater)
# reads. Bump "version" in package.json to ship an update to installed apps.

on:
  push:
    branches: [ "claude/confident-mayer-x9cxvu" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "release/**"
      # Web test build only (Render) — nothing here ships in the desktop app.
      - "src/server/**"
      - "src/web/**"
      - "render.yaml"
      - "scripts/web-test.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run smoke

      # Publish ONLY when package.json carries a version that has not been
      # released yet. electron-builder would otherwise reuse the existing release
      # and overwrite its installer, so an ordinary push (e.g. a web-test change
      # deployed to Render) would silently replace what clinics download, under
      # an already-announced version number. Bump the version to ship a release.
      - name: Is this a new version?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released - building as a check only, NOT republishing over it."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is new - will build and publish."
          fi

      # Build + publish to a GitHub Release (v<version>) so the auto-updater can
      # find latest.yml.
      - name: Build & publish installer
        if: steps.ver.outputs.publish == 'true'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer (check only - version already released)
        if: steps.ver.outputs.publish != 'true'
        run: npx electron-builder --win --x64 --publish never

      # Per-version release notes from CHANGELOG.md (shown on the GitHub Release).
      - name: Set release notes from CHANGELOG
        if: steps.ver.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/changelog.js "$VERSION" > RELEASE_NOTES.md
          echo "Release notes for v$VERSION:"; cat RELEASE_NOTES.md
          gh release edit "v$VERSION" --title "v$VERSION" --notes-file RELEASE_NOTES.md

      - name: List build output
        shell: bash
        run: ls -lh release/*.exe release/*.yml || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDR-Clinic-Windows
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 90
          if-no-files-found: error
