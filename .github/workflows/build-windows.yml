name: Build Windows Installer

# Produces the real Windows installer (.exe) on a Windows runner — no Wine
# needed there. Download it from the run's "Artifacts", or from the
# auto-published "latest-windows" pre-release.

on:
  push:
    branches: [ "claude/confident-mayer-x9cxvu" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run smoke

      - name: Build installer + portable
        run: npm run dist
        env:
          # electron-builder publishing is handled by the release step below.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -lh release/*.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDR-Clinic-Windows
          path: |
            release/*.exe
          retention-days: 90
          if-no-files-found: error

      - name: Publish "latest-windows" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: GDR Clinic — Latest Windows Build
          prerelease: true
          body: |
            Automated Windows build of GDR Clínica (Software Smiles).
            Download **GDR-Clinic-Setup-*.exe** (installer) or
            **GDR-Clinic-Portable-*.exe** (no install) below.
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
